name: Production Media Mutation Pipeline v4.0.1

on:
  workflow_dispatch:
    inputs:
      media_url:
        description: 'Direct download URL for input MP4'
        required: true
        default: 'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_1MB.mp4'
      preset:
        description: 'Mutation Aggressiveness Level'
        required: true
        default: 'standard'
        type: choice
        options:
          - transparent
          - standard
          - aggressive
      seed:
        description: 'Deterministic RNG Seed'
        required: false
        default: '42'
  push:
    paths:
      - '**.py'
      - '.github/workflows/mutate.yml'
  schedule:
    - cron: '0 0 * * 0'

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libchromaprint-tools python3-pip

      - name: Install Python Verification Dependencies (PEP 668 Fixed)
        run: |
          pip install --upgrade pip --break-system-packages
          pip install pillow imagehash --break-system-packages

      - name: Fetch Input Video Asset
        run: |
          curl -L "${{ github.event.inputs.media_url || 'https://test-videos.co.uk/vids/bigbuckbunny/mp4/h264/1080/Big_Buck_Bunny_1080_10s_1MB.mp4' }}" -o input.mp4

      - name: Execute Cryptographic Mutation Pipeline
        run: |
          python3 pipeline.py input.mp4 output.mp4 \
            --preset "${{ github.event.inputs.preset || 'standard' }}" \
            --seed "${{ github.event.inputs.seed || '42' }}" \
            --verify \
            --low-cpu

      - name: Upload Processed Video Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: processed-video
          path: |
            output.mp4
            manifest.json
          retention-days: 30
